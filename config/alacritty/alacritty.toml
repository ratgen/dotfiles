[general]
import = ["./catppuccin-mocha.toml"]

[window]
opacity = 0.94

[env]
TERM = "xterm-256color"

[font]
normal = { family = "BlexMono Nerd Font Mono", style = "Medium"}
size = 10.7

[terminal.shell]
program = "/bin/fish"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
